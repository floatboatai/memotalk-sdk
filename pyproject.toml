[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memotalk-sdk"
version = "0.1.0"
description = "MemoTalk S1 / AI-PEN BLE recorder client: transport layer, typed parsers, atomic capability API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Floatboat" }]
keywords = ["ble", "bluetooth", "voice-recorder", "memotalk", "ai-pen"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["bleak>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
memotalk = "memotalk.cli:main"

[project.urls]
Homepage = "https://github.com/floatboatai/memotalk-sdk"
Repository = "https://github.com/floatboatai/memotalk-sdk"
Issues = "https://github.com/floatboatai/memotalk-sdk/issues"

[tool.setuptools.packages.find]
include = ["memotalk*"]

[tool.setuptools.package-data]
memotalk = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Only rules that catch real defects: syntax errors, undefined names,
# unused imports/variables, duplicate definitions. The formatting-heavy
# default rule set would rewrite the whole codebase for no functional gain.
select = ["E9", "F63", "F7", "F82", "F401", "F811", "F841"]

