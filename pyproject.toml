[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memotalk-s1"
version = "0.1.0"
description = "MemoTalk S1 / AI-PEN BLE recorder client: transport layer, typed parsers, atomic capability API"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["ble", "bluetooth", "voice-recorder", "memotalk", "ai-pen"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = ["bleak>=0.21"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-asyncio>=0.23"]

[project.scripts]
memotalk = "memotalk.cli:main"

[tool.setuptools.packages.find]
include = ["memotalk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
