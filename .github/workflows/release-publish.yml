name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: false

concurrency:
  group: publish-ref
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + upload
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memotalk-sdk
    env:
      # The `secrets` context is NOT available inside step-level `if:`
      # expressions — GitHub's parser rejects the whole workflow file when it
      # appears there, registers the file as invalid, and then fires a
      # guaranteed-to-fail run on every push. Resolve it once here, where
      # `secrets` IS allowed, and branch the steps on `env` instead.
      PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 scripts/package_version.py)"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $tag_version does not match version $pkg_version"
            exit 1
          fi

      # Exactly one upload step runs. Never reference `secrets` inside a
      # step-level `if:` — see the env block above.

      - name: Upload to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Upload to PyPI (trusted publishing)
        if: ${{ github.event_name == 'release' && env.PYPI_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

      - name: Upload to PyPI (trusted publishing, manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && env.PYPI_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

      - name: Upload to PyPI (API token)
        if: ${{ github.event_name == 'release' && env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          password: ${{ env.PYPI_TOKEN }}
          verbose: true

      - name: Upload to PyPI (API token, manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && env.PYPI_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          password: ${{ env.PYPI_TOKEN }}
          verbose: true
