name: Release to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: false

concurrency:
  group: publish-ref
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: build + upload
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memotalk-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Check the tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(python3 scripts/package_version.py)"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $tag_version does not match version $pkg_version"
            exit 1
          fi

      - name: Upload to TestPyPI
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Upload to PyPI
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

      - name: Upload to PyPI with a token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
