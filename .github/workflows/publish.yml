name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Upload to TestPyPI instead of PyPI"
        type: boolean
        default: false

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write   # trusted publishing (OIDC) - no long-lived token needed

jobs:
  publish:
    name: build + upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/memotalk-sdk
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run --no-project python -c \
            "import re;print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml',encoding='utf-8').read(), re.M).group(1))")"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::release tag $tag_version does not match pyproject version $pkg_version"
            exit 1
          fi

      - name: Upload to TestPyPI (dry run)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true
          verbose: true

      - name: Upload to PyPI (trusted publishing / OIDC)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          verbose: true

      - name: Upload to PyPI (API token)
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) && secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://upload.pypi.org/legacy/
          packages-dir: dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
          verbose: true
