name: QE

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Build distributions
        run: uv build --out-dir dist

      - name: Check the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv run --no-project python -c \
            "import re;print(re.search(r'^version\s*=\s*\"([^\"]+)\"', open('pyproject.toml',encoding='utf-8').read(), re.M).group(1))")"
          echo "tag=$tag_version package=$pkg_version"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::release tag $tag_version does not match pyproject version $pkg_version"
            exit 1
          fi

